name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . "openai==1.109.1" "pytest==8.3.3" "pytest-asyncio==0.24.0"  # google-genai is imported lazily and needs pydantic>=2.12.5, which conflicts with the pinned 2.9.2
      - name: Test (no network, no keys)
        run: pytest -q
